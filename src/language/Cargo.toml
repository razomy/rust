[package]
name = "razomy_language"
version = "0.6.4"
edition = "2021"
default-run = "razomy"

[lib]
name = "razomy_language"
path = "src/lib.rs"

[[bin]]
name = "razomy"
path = "src/main.rs"

[[bin]]
name = "razomy-lsp"
path = "src/bin/razomy_lsp.rs"

[dependencies]
pest = "2.9.3"
pest_derive = "2.9.3"
serde_json = "1.0.154"

[dev-dependencies]
insta = "1.49.0"