[package]
name = "razomy-notation"
version = "0.1.0"
edition = "2021"
description = "Razomy Notation (.rn) v0.1.0 — Layer 0 Universal Stream Root, Symmetric Triad, Schema Portals, Column-0 Strings, Algebraic Composition (&, ^, /), Outliner, LSP, and Multi-Format Codegen/Importers"
license = "MIT"

[lib]
name = "razomy_notation"
path = "src/lib.rs"

[[bin]]
name = "rn"
path = "src/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2.2", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"